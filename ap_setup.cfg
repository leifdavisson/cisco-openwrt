! Cisco Aironet 3702i Standalone Autonomous Configuration Template
! License: GNU AGPLv3
! Description: Configures 2.4GHz (b/g/n) and 5GHz (a/n/ac) radios with WPA2-PSK,
!              bridged directly to GigabitEthernet0 for use with home routers (e.g. OpenWrt).

service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption

hostname Cisco-AP3702

enable secret <ENABLE_SECRET>

! Allow HTTP and HTTPS Web GUI configuration
ip http server
ip http secure-server

! Configure Wi-Fi SSID
dot11 ssid OpenWrt-WiFi
   authentication open
   authentication key-management wpa2
   wpa2-psk ascii <WPA2_PSK>
   guest-mode

! 2.4 GHz Radio (Dot11Radio0)
interface Dot11Radio0
 no ip address
 no ip route-cache
 !
 encryption mode ciphers aes-ccm 
 !
 ssid OpenWrt-WiFi
 !
 speed basic-1.0 basic-2.0 basic-5.5 6.0 9.0 basic-11.0 12.0 18.0 24.0 36.0 48.0 54.0 m0. m1. m2. m3. m4. m5. m6. m7. m8. m9. m10. m11. m12. m13. m14. m15.
 channel 6
 station-role root
 bridge-group 1
 no shutdown

! 5 GHz Radio (Dot11Radio1 - 802.11ac Wave 1)
interface Dot11Radio1
 no ip address
 no ip route-cache
 !
 encryption mode ciphers aes-ccm 
 !
 ssid OpenWrt-WiFi
 !
 speed basic-6.0 9.0 basic-12.0 18.0 basic-24.0 36.0 48.0 54.0 m0. m1. m2. m3. m4. m5. m6. m7. m8. m9. m10. m11. m12. m13. m14. m15.
 channel 36
 station-role root
 bridge-group 1
 no shutdown

! Ethernet port connecting to your switch / OpenWrt router
interface GigabitEthernet0
 no ip address
 bridge-group 1

! Management interface: obtains IP from your local DHCP server automatically
interface BVI1
 ip address dhcp client-id GigabitEthernet0
 no shutdown

bridge 1 route ip

end
write memory
