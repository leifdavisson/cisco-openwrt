[project]
name = "cisco-openwrt"
version = "0.1.0"
description = "OpenWrt porting toolkit and drivers for Cisco Aironet 3702i (Freescale P1023)"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    "sdk",
    "imagebuilder",
    "backups",
    "firmware_dl",
    "driver",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # long embedded shell/config strings in repacker scripts
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = "(sdk|imagebuilder|backups|firmware_dl|driver)/"
